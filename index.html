<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiori Dashboard</title>
    
    <!-- OpenUI5 Bootstrap -->
    <script
        id="sap-ui-bootstrap"
        src="https://openui5.hana.ondemand.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_fiori_3"
        data-sap-ui-resourceroots='{
            "com.dashboard.fiori": "./webapp/"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-bindingSyntax="complex">
    </script>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
        }
        
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-size: 24px;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="sapUiBody">
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="loading-spinner"></div>
        <div>Loading Fiori Dashboard...</div>
    </div>

    <!-- Main Application Container -->
    <div
        data-sap-ui-component
        data-name="com.dashboard.fiori"
        data-id="container"
        data-settings='{"id" : "com.dashboard.fiori"}'
        style="width:100%; height:100%;">
    </div>

    <script>
        // Hide splash screen after UI5 loads
        sap.ui.getCore().attachInit(function() {
            setTimeout(function() {
                var splashScreen = document.getElementById('splash-screen');
                if (splashScreen) {
                    splashScreen.style.opacity = '0';
                    setTimeout(function() {
                        splashScreen.style.display = 'none';
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>
</html>
